[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sqdkit"
version = "0.0.0"
description = "Research-oriented sample-based quantum diagonalization framework"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2,<3",
    "qiskit-aer>=0.17,<0.18",
    "qiskit-addon-sqd>=0.12,<0.13",
    "ffsim>=0.0.83",
    "pyscf>=2.12",
    "qiskit-ibm-runtime",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
markers = ["slow"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
